<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1672 941" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="北斗七星证据顿悟动画版">
  <title>北斗七星（金棕色，证据—顿悟版）</title>
  <desc>透明底。星星按从大到小的顺序逐渐显现，越小的星显现越慢。全部证据显现后，以天权为关键节点，连线从中间向两侧依次展开，像思路忽然被串联起来。勺口不闭合。</desc>
