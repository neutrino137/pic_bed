<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Karp 1972：NP-complete 从孤例变成山脉">
  <rect width="1200" height="900" fill="#fbf8f1"/>

  <defs>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#8a6b2f"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#a6533c"/>
    </marker>
    <style>
      .title { font-family: serif; font-size: 34px; font-weight: 700; fill: #5e4620; }
      .subtitle { font-family: serif; font-size: 18px; fill: #7b6540; }
      .main { fill: #fff2c7; stroke: #b99735; stroke-width: 3.2; }
      .karp { fill: #f4c7c3; stroke: #ad5a52; stroke-width: 3.2; }
      .domain { fill: #fffdf7; stroke: #b99735; stroke-width: 2.2; }
      .result { fill: #efe3ff; stroke: #7b5598; stroke-width: 2.8; }
      .label { font-family: serif; font-size: 22px; font-weight: 700; fill: #4f3c18; }
      .label-red { font-family: serif; font-size: 22px; font-weight: 700; fill: #87372f; }
      .label-purple { font-family: serif; font-size: 24px; font-weight: 700; fill: #57366e; }
      .small { font-family: serif; font-size: 16px; fill: #6d5731; }
      .tiny { font-family: serif; font-size: 14px; fill: #765d16; }
      .arrow { fill: none; stroke: #8a6b2f; stroke-width: 2.5; marker-end: url(#arrowGold); }
      .arrow-red { fill: none; stroke: #a6533c; stroke-width: 2.8; marker-end: url(#arrowRed); }
      .arrow-light { fill: none; stroke: #b08b42; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrowGold); }
      .note { font-family: serif; font-size: 18px; fill: #6b5633; }
    </style>
  </defs>

  <text x="600" y="52" text-anchor="middle" class="title">Karp 1972：NP-complete 从孤例变成山脉</text>
  <text x="600" y="84" text-anchor="middle" class="subtitle">Cook-Levin 点亮 SAT；Karp 发现，许多领域的困难都接在同一张难度网络上。</text>

  <rect x="455" y="122" width="290" height="86" rx="22" class="main"/>
  <text x="600" y="158" text-anchor="middle" class="label">SAT</text>
  <text x="600" y="186" text-anchor="middle" class="small">Cook-Levin：第一个 NP-complete 核心</text>

  <path d="M600 208 C600 240,600 262,600 296" class="arrow-red"/>

  <rect x="410" y="296" width="380" height="96" rx="26" class="karp"/>
  <text x="600" y="333" text-anchor="middle" class="label-red">Karp 1972</text>
  <text x="600" y="363" text-anchor="middle" class="small">SAT 的完全性传递给另外 21 个经典问题</text>
  <text x="600" y="385" text-anchor="middle" class="small">NP-complete 不再只是一个逻辑学孤例</text>

  <path d="M600 392 C420 440,260 455,190 512" class="arrow"/>
  <path d="M600 392 C520 440,430 462,390 512" class="arrow"/>
  <path d="M600 392 C600 440,600 466,600 512" class="arrow"/>
  <path d="M600 392 C680 440,770 462,810 512" class="arrow"/>
  <path d="M600 392 C780 440,940 455,1010 512" class="arrow"/>

  <rect x="82" y="512" width="220" height="98" rx="20" class="domain"/>
  <text x="192" y="548" text-anchor="middle" class="label">图论</text>
  <text x="192" y="576" text-anchor="middle" class="tiny">CLIQUE · VERTEX COVER</text>
  <text x="192" y="598" text-anchor="middle" class="tiny">HAMILTONIAN CYCLE</text>

  <rect x="310" y="512" width="220" height="98" rx="20" class="domain"/>
  <text x="420" y="548" text-anchor="middle" class="label">集合系统</text>
  <text x="420" y="576" text-anchor="middle" class="tiny">SET COVER</text>
  <text x="420" y="598" text-anchor="middle" class="tiny">SET PACKING</text>

  <rect x="540" y="512" width="220" height="98" rx="20" class="domain"/>
  <text x="650" y="548" text-anchor="middle" class="label">整数问题</text>
  <text x="650" y="576" text-anchor="middle" class="tiny">PARTITION</text>
  <text x="650" y="598" text-anchor="middle" class="tiny">SUBSET SUM</text>

  <rect x="770" y="512" width="220" height="98" rx="20" class="domain"/>
  <text x="880" y="548" text-anchor="middle" class="label">组合优化</text>
  <text x="880" y="576" text-anchor="middle" class="tiny">TSP（判定版）</text>
  <text x="880" y="598" text-anchor="middle" class="tiny">KNAPSACK</text>

  <rect x="998" y="512" width="120" height="98" rx="20" class="domain"/>
  <text x="1058" y="548" text-anchor="middle" class="label">更多</text>
  <text x="1058" y="576" text-anchor="middle" class="tiny">调度</text>
  <text x="1058" y="598" text-anchor="middle" class="tiny">网络设计</text>

  <path d="M192 610 C250 650,345 675,430 702" class="arrow-light"/>
  <path d="M420 610 C455 650,505 674,545 702" class="arrow-light"/>
  <path d="M650 610 C650 650,650 675,650 702" class="arrow-light"/>
  <path d="M880 610 C830 650,770 675,755 702" class="arrow-light"/>
  <path d="M1058 610 C955 650,850 675,780 702" class="arrow-light"/>

  <rect x="305" y="702" width="590" height="92" rx="28" class="result"/>
  <text x="600" y="741" text-anchor="middle" class="label-purple">21 个 NP-complete 问题</text>
  <text x="600" y="771" text-anchor="middle" class="small">后来扩散成成千上万个后继问题</text>

  <path d="M600 794 C600 815,600 825,600 842" class="arrow-red"/>

  <rect x="250" y="842" width="700" height="42" rx="18" fill="#f3ead7" stroke="#d7c7a1" stroke-width="1.5"/>
  <text x="600" y="869" text-anchor="middle" class="note">Cook 给出第一块石头；Karp 发现，那是一整座山脉的入口。</text>
</svg>