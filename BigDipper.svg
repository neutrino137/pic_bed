<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg" background="transparent">
  <defs>
    <filter id="star-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#443311" flood-opacity="0.8"/>
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#a68a64" flood-opacity="0.6" result="flood"/>
      <feComposite operator="in" in="flood" in2="blur" result="coloredBlur"/>
      <feComposite operator="over" in="SourceGraphic" in2="coloredBlur"/>
    </filter>

    <style>
      /* 纯透明度闪烁动画：星星完全静态不动，仅亮度改变 */
      @keyframes twinkleOnlyOpacity {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }

      /* 星星基础样式 */
      .star {
        fill: #a68a64; /* 您指定的新颜色实心圆 */
        stroke: none; /* 彻底删除边框 */
        filter: url(#star-glow); /* 应用复合滤镜 */
        animation: twinkleOnlyOpacity 3s infinite ease-in-out; /* 应用动画 */
      }

      /* 连接线样式：subtle and semi-transparent, colored by #a68a64 */
      .link {
        fill: none;
        stroke: #a68a64;
        stroke-width: 0.8;
        stroke-dasharray: 4 4;
        opacity: 0.2;
      }

      /* 不同步闪烁延迟，模拟自然夜空 */
      .delay-1 { animation-delay: 0s; }
      .delay-2 { animation-delay: 0.5s; }
      .delay-3 { animation-delay: 1.0s; }
      .delay-4 { animation-delay: 1.5s; }
      .delay-5 { animation-delay: 0.3s; }
      .delay-6 { animation-delay: 0.8s; }
      .delay-7 { animation-delay: 1.2s; }
    </style>
  </defs>

  <g transform="translate(15, 15)">
    
    <polyline class="link" points="53,245 110,159 179,143 272,127 324,178 448,137 443,54 272,127" />

    <circle class="star delay-1" cx="53" cy="245" r="4.8" />
    
    <circle class="star delay-2" cx="110" cy="159" r="4.2" />
    
    <circle class="star delay-3" cx="179" cy="143" r="5.0" />
    
    <circle class="star delay-4" cx="272" cy="127" r="2.5" />
    
    <circle class="star delay-5" cx="324" cy="178" r="3.8" />
    
    <circle class="star delay-6" cx="448" cy="137" r="4.0" />
    
    <circle class="star delay-7" cx="443" cy="54" r="5.0" />

  </g>
</svg>
