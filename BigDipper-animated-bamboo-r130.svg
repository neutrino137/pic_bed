<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1672 941" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="北斗七星动画版">
  <title>北斗七星（竹青色，动画版）</title>
  <desc>透明底。星星按顺序慢慢出现，然后虚线依次连接。勺口不闭合。</desc>
  <line x1="124" y1="371" x2="124" y2="371" stroke="#789587" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="7 9" stroke-opacity="0" fill="none">
    <animate attributeName="stroke-opacity" from="0" to="0.56" begin="3.29s" dur="0.12s" fill="freeze"/>
    <animate attributeName="x2" from="124" to="447" begin="3.29s" dur="0.55s" fill="freeze"/>
    <animate attributeName="y2" from="371" to="230" begin="3.29s" dur="0.55s" fill="freeze"/>
  </line>
  <line x1="447" y1="230" x2="447" y2="230" stroke="#789587" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="7 9" stroke-opacity="0" fill="none">
    <animate attributeName="stroke-opacity" from="0" to="0.56" begin="4.02s" dur="0.12s" fill="freeze"/>
    <animate attributeName="x2" from="447" to="686" begin="4.02s" dur="0.55s" fill="freeze"/>
    <animate attributeName="y2" from="230" to="293" begin="4.02s" dur="0.55s" fill="freeze"/>
  </line>
  <line x1="686" y1="293" x2="686" y2="293" stroke="#789587" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="7 9" stroke-opacity="0" fill="none">
    <animate attributeName="stroke-opacity" from="0" to="0.56" begin="4.75s" dur="0.12s" fill="freeze"/>
    <animate attributeName="x2" from="686" to="979" begin="4.75s" dur="0.55s" fill="freeze"/>
    <animate attributeName="y2" from="293" to="355" begin="4.75s" dur="0.55s" fill="freeze"/>
  </line>
  <line x1="979" y1="355" x2="979" y2="355" stroke="#789587" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="7 9" stroke-opacity="0" fill="none">
    <animate attributeName="stroke-opacity" from="0" to="0.56" begin="5.48s" dur="0.12s" fill="freeze"/>
    <animate attributeName="x2" from="979" to="1084" begin="5.48s" dur="0.55s" fill="freeze"/>
    <animate attributeName="y2" from="355" to="578" begin="5.48s" dur="0.55s" fill="freeze"/>
  </line>
  <line x1="1084" y1="578" x2="1084" y2="578" stroke="#789587" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="7 9" stroke-opacity="0" fill="none">
    <animate attributeName="stroke-opacity" from="0" to="0.56" begin="6.21s" dur="0.12s" fill="freeze"/>
    <animate attributeName="x2" from="1084" to="1485" begin="6.21s" dur="0.55s" fill="freeze"/>
    <animate attributeName="y2" from="578" to="502" begin="6.21s" dur="0.55s" fill="freeze"/>
  </line>
  <line x1="1485" y1="502" x2="1485" y2="502" stroke="#789587" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="7 9" stroke-opacity="0" fill="none">
    <animate attributeName="stroke-opacity" from="0" to="0.56" begin="6.94s" dur="0.12s" fill="freeze"/>
    <animate attributeName="x2" from="1485" to="1479" begin="6.94s" dur="0.55s" fill="freeze"/>
    <animate attributeName="y2" from="502" to="219" begin="6.94s" dur="0.55s" fill="freeze"/>
  </line>
  <!-- 摇光 / Alkaid -->
  <circle cx="124" cy="371" r="0" fill="#789587" fill-opacity="0">
    <animate attributeName="r" from="0" to="14.30" begin="0.00s" dur="0.42s" fill="freeze" calcMode="spline" keySplines="0.22 0.85 0.35 1" keyTimes="0;1"/>
    <animate attributeName="fill-opacity" from="0" to="0.88" begin="0.00s" dur="0.42s" fill="freeze"/>
  </circle>
  <!-- 开阳 / Mizar -->
  <circle cx="447" cy="230" r="0" fill="#789587" fill-opacity="0">
    <animate attributeName="r" from="0" to="13.00" begin="0.42s" dur="0.42s" fill="freeze" calcMode="spline" keySplines="0.22 0.85 0.35 1" keyTimes="0;1"/>
    <animate attributeName="fill-opacity" from="0" to="0.88" begin="0.42s" dur="0.42s" fill="freeze"/>
  </circle>
  <!-- 玉衡 / Alioth -->
  <circle cx="686" cy="293" r="0" fill="#789587" fill-opacity="0">
    <animate attributeName="r" from="0" to="14.95" begin="0.84s" dur="0.42s" fill="freeze" calcMode="spline" keySplines="0.22 0.85 0.35 1" keyTimes="0;1"/>
    <animate attributeName="fill-opacity" from="0" to="0.88" begin="0.84s" dur="0.42s" fill="freeze"/>
  </circle>
  <!-- 天权 / Megrez -->
  <circle cx="979" cy="355" r="0" fill="#789587" fill-opacity="0">
    <animate attributeName="r" from="0" to="7.28" begin="1.26s" dur="0.42s" fill="freeze" calcMode="spline" keySplines="0.22 0.85 0.35 1" keyTimes="0;1"/>
    <animate attributeName="fill-opacity" from="0" to="0.88" begin="1.26s" dur="0.42s" fill="freeze"/>
  </circle>
  <!-- 天玑 / Phecda -->
  <circle cx="1084" cy="578" r="0" fill="#789587" fill-opacity="0">
    <animate attributeName="r" from="0" to="11.05" begin="1.68s" dur="0.42s" fill="freeze" calcMode="spline" keySplines="0.22 0.85 0.35 1" keyTimes="0;1"/>
    <animate attributeName="fill-opacity" from="0" to="0.88" begin="1.68s" dur="0.42s" fill="freeze"/>
  </circle>
  <!-- 天璇 / Merak -->
  <circle cx="1485" cy="502" r="0" fill="#789587" fill-opacity="0">
    <animate attributeName="r" from="0" to="11.31" begin="2.10s" dur="0.42s" fill="freeze" calcMode="spline" keySplines="0.22 0.85 0.35 1" keyTimes="0;1"/>
    <animate attributeName="fill-opacity" from="0" to="0.88" begin="2.10s" dur="0.42s" fill="freeze"/>
  </circle>
  <!-- 天枢 / Dubhe -->
  <circle cx="1479" cy="219" r="0" fill="#789587" fill-opacity="0">
    <animate attributeName="r" from="0" to="14.69" begin="2.52s" dur="0.42s" fill="freeze" calcMode="spline" keySplines="0.22 0.85 0.35 1" keyTimes="0;1"/>
    <animate attributeName="fill-opacity" from="0" to="0.88" begin="2.52s" dur="0.42s" fill="freeze"/>
  </circle>
</svg>