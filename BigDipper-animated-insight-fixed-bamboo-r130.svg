    <animate attributeName="x2" from="686" to="979" begin="5.21s" dur="0.26s" fill="freeze" calcMode="spline" keySplines="0.20 0.85 0.25 1" keyTimes="0;1"/>
    <animate attributeName="y2" from="293" to="355" begin="5.21s" dur="0.26s" fill="freeze" calcMode="spline" keySplines="0.20 0.85 0.25 1" keyTimes="0;1"/>
  </line>
