  <circle cx="1479" cy="219" r="0" fill="#789587" fill-opacity="0">
    <animate attributeName="r" from="0" to="14.69" begin="0.36s" dur="0.37s" fill="freeze" calcMode="spline" keySplines="0.22 0.85 0.35 1" keyTimes="0;1"/>
