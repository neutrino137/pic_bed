<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1672 941" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="北斗七星动画版">
  <title>北斗七星（竹青色，证据显现后连线）</title>
  <desc>透明底。星星按从大到小顺序显现，越小的星显现越慢。全部显现后，连线再依次出现。勺口不闭合。</desc>
  <line x1="124" y1="371" x2="124" y2="371" stroke="#789587" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="7 9" stroke-opacity="0" fill="none">
    <animate attributeName="stroke-opacity" from="0" to="0.56" begin="4.59s" dur="0.08s" fill="freeze"/>
    <animate attributeName="x2" from="124" to="447" begin="4.59s" dur="0.26s" fill="freeze" calcMode="spline" keySplines="0.20 0.85 0.25 1" keyTimes="0;1"/>
    <animate attributeName="y2" from="371" to="230" begin="4.59s" dur="0.26s" fill="freeze" calcMode="spline" keySplines="0.20 0.85 0.25 1" keyTimes="0;1"/>
  </line>
